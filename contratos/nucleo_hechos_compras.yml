tabla: nucleo_hechos_compras
descripcion: Pedidos de reposicion por sucursal y SKU con lead time y recepcion.
grano: una fila por fecha de pedido, sucursal y producto.
columnas:
  - {nombre: fecha_pedido, tipo: DATE, nulo: false}
  - {nombre: fecha_pedido_id, tipo: INTEGER, nulo: false}
  - {nombre: sucursal_id, tipo: VARCHAR, nulo: false}
  - {nombre: producto_id, tipo: VARCHAR, nulo: false}
  - {nombre: proveedor_id, tipo: VARCHAR, nulo: false}
  - {nombre: unidades_pedido, tipo: INTEGER, nulo: false}
  - {nombre: lead_time_dias, tipo: INTEGER, nulo: false}
  - {nombre: fecha_recepcion, tipo: DATE, nulo: false}
  - {nombre: estado, tipo: VARCHAR, nulo: false}
  - {nombre: unidades_recibidas, tipo: INTEGER, nulo: false}
unicidad: [fecha_pedido, sucursal_id, producto_id]
rangos:
  fecha_pedido: {min: "2024-01-01", max: "2025-12-31"}
  unidades_pedido: {min: 1, max: 50000}
  lead_time_dias: {min: 1, max: 40}
  unidades_recibidas: {min: 0, max: 50000}
claves_foraneas:
  - {columnas: [sucursal_id], tabla: dim_sucursal, columna: sucursal_id}
  - {columnas: [producto_id], tabla: dim_producto, columna: producto_id}
  - {columnas: [proveedor_id], tabla: dim_proveedor, columna: proveedor_id}
filas_minimas: 100
